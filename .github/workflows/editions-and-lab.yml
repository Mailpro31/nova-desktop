# Compiler les deux éditions, et la feature Lab, à chaque changement.
#
# Le travail Organization se fait sur une machine qui n'a ni Rust ni Bun. Ce
# workflow n'est donc pas un confort : c'est le seul endroit où le code écrit
# pour le sélecteur d'édition et pour le mode Lab est réellement compilé.
#
# Il vérifie aussi une propriété qui ne se voit pas à la lecture : que le Lab
# est absent d'un binaire de production. Une feature qu'on croit désactivée
# alors qu'elle est compilée est exactement le genre de chose qui ne se
# découvre qu'en production.

name: "editions and lab"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - ".github/workflows/editions-and-lab.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - ".github/workflows/editions-and-lab.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Le frontend décide l'édition à la compilation. Les deux doivent typer et
  # construire : une régression n'apparaît que dans celle qu'on n'a pas bâtie.
  frontend-editions:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        edition: [personal, campus]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Type-check and build (${{ matrix.edition }})
        env:
          VITE_NOVA_MODE: ${{ matrix.edition }}
        run: bun run build

  # L'artefact Lab est bati avec une variable de plus. Rien d'autre ne compile
  # cette combinaison, et c'est elle qui part sur le PC de demonstration.
  frontend-lab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Type-check and build (lab)
        env:
          VITE_NOVA_MODE: campus
          VITE_NOVA_LAB: "1"
        run: bun run build

  # Les tests unitaires TypeScript existent depuis longtemps mais rien ne les
  # exécutait : `bun run test` ne lance qu'un seul fichier, et la CI Rust ne
  # touche pas au frontend. Le périmètre est celui de la fondation Organization,
  # là où se décident l'édition, l'identité et les fournisseurs.
  organization-unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Organization unit tests
        run: bun test src/lib/organization tests/campusPolicy.test.ts

      # Le premier lancement de Nova Lab affichait une fenetre blanche. Ces
      # deux fichiers tiennent les invariants qui l'empechent de revenir : la
      # racine React ne rend jamais « rien », et l'artefact Lab reste separe de
      # Nova (nom, identifiant, donnees, telechargements, mises a jour).
      - name: Startup and Lab isolation tests
        run: bun test src/lib/startupGate.test.ts src/lib/labIsolation.test.ts

      # L'ecran « Essayez Nova » restait bloque sur « Application du Style... »
      # quand la dictee echouait : le backend enregistre une entree a texte vide
      # pour permettre une nouvelle tentative, et cet ecran la prenait pour une
      # reformulation en cours. L'invariant teste ici : rien ne peut laisser
      # l'interface en chargement.
      - name: The tutorial card must never stay loading
        run: bun test src/lib/tutorialPhase.test.ts

  rust-lab-feature:
    runs-on: ubuntu-24.04
    # Sans cela, un test qui attend indefiniment occupe un runner jusqu'a la
    # limite de six heures de GitHub. `cargo test` n'impose aucun delai : c'est
    # au workflow de le faire.
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libasound2-dev libssl-dev libgtk-layer-shell-dev libvulkan-dev glslc spirv-headers

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Compiler d'abord, executer ensuite. Reunies, les deux etapes ne
      # montraient qu'une seule ligne pendant des heures sans dire laquelle
      # avancait — c'est ce qui a rendu le blocage illisible.
      - name: Compile the lab feature and its tests
        working-directory: src-tauri
        timeout-minutes: 30
        run: cargo test --features lab --no-run --verbose

      # La feature Lab doit passer ses tests. Sans ce job elle pourrirait en
      # silence : rien d'autre ne la construit.
      - name: Run the lab test suite
        working-directory: src-tauri
        timeout-minutes: 10
        run: cargo test --features lab -- --nocapture

      # L'invariant qui a manque : `Builder::commands()` REMPLACE la liste
      # enregistree. Un second appel sous `#[cfg(feature = "lab")]` effacait
      # toutes les commandes ordinaires, et l'artefact Lab repondait
      # « Command get_app_settings not found » des le premier ecran. Ces tests
      # inspectent la table reellement enregistree, pas le source.
      - name: The lab build must keep every ordinary command
        working-directory: src-tauri
        timeout-minutes: 5
        run: cargo test --features lab specta_registration -- --nocapture

      # Et la meme table, sans la surface Lab, dans le paquet ordinaire.
      - name: The ordinary build must expose no lab command
        working-directory: src-tauri
        timeout-minutes: 5
        run: cargo test specta_registration -- --nocapture

      # L'enrolement Lab ne vivait qu'en memoire : apres un redemarrage le
      # certificat epingle et le jeton du peripherique disparaissaient, la
      # liaison TLS echouait, et le poste retombait en local en paraissant
      # l'avoir choisi. Ces tests rejouent le scenario complet — enrolement,
      # fermeture, restauration, appel authentifie — et verifient surtout que
      # le jeton n'atteint jamais le disque.
      - name: The lab enrollment must survive a restart, secret excluded
        working-directory: src-tauri
        timeout-minutes: 5
        run: cargo test --features lab lab_persistence -- --nocapture

      # Le serveur repond `{ "text": ... }`. Les deux chemins de dictee
      # demandaient une chaine JSON nue, et `serde` refusait donc un objet
      # parfaitement valide. Invisible a la compilation : l'inference choisit
      # `T = String` sans rien signaler.
      - name: Campus responses must be read as objects
        working-directory: src-tauri
        timeout-minutes: 5
        run: cargo test campus_response -- --nocapture

      # La trace de diagnostic ne doit jamais pouvoir ecrire un secret. Le test
      # pose de vrais en-tetes sensibles sur la requete et verifie qu'aucun
      # fragment n'atteint la ligne de journal.
      - name: The diagnostic trace must never leak a secret
        working-directory: src-tauri
        timeout-minutes: 5
        run: cargo test campus_trace -- --nocapture

      # Un vrai serveur local compte les octets. Le serveur du Lab a montre que
      # le poste annoncait la taille du seul fichier audio et envoyait
      # l'enveloppe multipart en plus : l'API recevait un multipart tronque, et
      # les octets restants faisaient repondre 400 a la passerelle. Ce test
      # refait ce comptage avant la mise en production, pas apres.
      - name: The announced Content-Length must match the bytes sent
        working-directory: src-tauri
        timeout-minutes: 5
        run: cargo test --features lab multipart_wire -- --nocapture

      # Le test en HTTP simple passait pendant que la production echouait : la
      # difference etait le transport. Celui-ci monte un vrai serveur TLS, fait
      # epingler son certificat au poste comme le fait un Lab, et compte les
      # octets **dechiffres** arrivant apres le corps declare.
      - name: Nothing may be written after the declared body over pinned TLS
        working-directory: src-tauri
        timeout-minutes: 5
        run: cargo test --features lab multipart_tls_wire -- --nocapture

      # Le transport Lab n'accepte qu'une identite : le certificat retenu a
      # l'enrolement. Ces tests exigent le refus dans tous les autres cas —
      # autre certificat, autre nom, hors periode de validite, chaine presentee.
      # Un epinglage qui n'echoue jamais n'epingle rien.
      - name: The pinned TLS identity must reject everything else
        working-directory: src-tauri
        timeout-minutes: 5
        run: cargo test --features lab lab_tls -- --nocapture

      # Et elle doit être absente par défaut. `cargo tree -e features` liste ce
      # que la construction par défaut active réellement, ce qui est plus solide
      # que relire le Cargo.toml.
      - name: The lab feature must not be enabled by default
        working-directory: src-tauri
        run: |
          set -euo pipefail
          if cargo tree -e features --prefix none 2>/dev/null | grep -q 'feature "lab"'; then
            echo "La feature 'lab' est active dans la construction par defaut."
            echo "Un binaire de production ne doit pas contenir le code Lab."
            exit 1
          fi
          echo "ok: 'lab' absente de la construction par defaut"

      - name: The Lab package must install beside production Nova
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          production = json.loads(Path("src-tauri/tauri.conf.json").read_text())
          lab = json.loads(Path("src-tauri/tauri.lab.conf.json").read_text())
          assert lab["productName"] != production["productName"]
          assert lab["identifier"] != production["identifier"]
          assert lab["mainBinaryName"] == "Nova Lab"
          assert lab["bundle"]["windows"]["nsis"]["installMode"] == "currentUser"
          allow = lab["app"]["security"]["assetProtocol"]["scope"]["allow"]
          assert lab["identifier"] in allow[0]
          print("ok: Nova Lab is isolated from production Nova")
          PY

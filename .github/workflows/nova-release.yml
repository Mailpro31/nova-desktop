name: "Nova — Release Windows (mise à jour auto)"

# Compile l'installeur Windows signé (minisign) + latest.json et les publie
# dans le dépôt PUBLIC dédié aux téléchargements (Mailpro31/nova-releases), via
# le secret RELEASES_TOKEN. Le dépôt du CODE (nova-desktop) peut ainsi rester
# privé, tandis que le téléchargement (site novaspeak.app) et l'auto-update de
# l'app restent publics.
#
# L'app (endpoint updater → nova-releases/releases/latest/download/latest.json)
# détecte la nouveauté et propose la mise à jour en un clic. Le lien du site
# pointe vers nova-releases/releases/latest/download/Nova-Setup.exe (nom stable
# entre versions).
#
# Prérequis (secrets du dépôt nova-desktop) :
#   - TAURI_SIGNING_PRIVATE_KEY          (clé privée minisign générée pour Nova)
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD (vide si la clé n'a pas de mot de passe)
#   - RELEASES_TOKEN                     (PAT avec Contents:write sur nova-releases)
#
# Pour livrer une version : bump la "version" dans src-tauri/tauri.conf.json
# (+ package.json), pousse, puis lance ce workflow. La release publique est
# créée/mise à jour automatiquement.

on: workflow_dispatch

# Nova personnel n'est plus publié (décision du 30/09/2026) : Nova se concentre
# sur l'édition Organization, pour les établissements. Le canal de mise à jour
# est celui de `nova-release-organization.yml`.
#
# Ce workflow est désactivé, pas supprimé : les postes Personal déjà installés
# gardent leur dernière version, et le code de l'édition reste en place tant
# que sa suppression n'a pas été faite dans une PR à part. Pour le rouvrir,
# retirer le job `retired` et la ligne `needs` qui y mène.

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Nova personnel n'est plus publie
        run: |
          echo "::error::Nova personnel n'est plus publie depuis le 30/09/2026. Utiliser « Nova Organization — Release Windows » (nova-release-organization.yml)."
          exit 1

  publish-windows:
    needs: retired
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: "windows-latest"
      target: "x86_64-pc-windows-msvc"
      # Active la génération des artefacts updater signés (.sig) pour CE build
      # (la conf par défaut garde createUpdaterArtifacts=false, pour que les
      # builds de test ne réclament pas la clé de signature).
      build-args: '--config {"bundle":{"createUpdaterArtifacts":true}}'
      # Signature de CODE Windows (Azure) non requise : seule la signature
      # updater (minisign, via TAURI_SIGNING_PRIVATE_KEY) l'est.
      sign-binaries: false
      asset-prefix: "nova"
      upload-artifacts: false
      # Publie l'installeur + latest.json dans ce dépôt public (via RELEASES_TOKEN).
      releases-repo: "Mailpro31/nova-releases"
      # Une release part toujours d'une compilation propre.
      no-cache: true
    secrets: inherit

name: "PR Test Build"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to build"
        required: true
        type: string

jobs:
  # Construction d'une PR : du code que personne n'a encore revu.
  #
  # Ce job compile délibérément du code non fiable. Il ne doit donc porter ni
  # secret de signature, ni jeton de publication, ni droit d'écriture sur le
  # dépôt : `bun install` et les scripts de build de la PR s'exécutent ici, et
  # tout ce qui est présent à ce moment-là est à la portée de leur auteur.
  #
  # `contents: read` suffit à cloner. L'écriture servait à publier des assets de
  # release, ce qu'un build de PR ne fait jamais.
  build-test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04"
            args: "--bundles appimage,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04-arm" # Build for ARM64 Linux
            args: "--bundles appimage,deb,rpm"
            target: "aarch64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "windows-11-arm"
            args: "--target aarch64-pc-windows-msvc"
            target: "aarch64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      # Jamais de signature sur une PR. Signer suppose de tenir la clé privée
      # dans le même job que le code de la PR, ce qui la remet à son auteur.
      # Un build de test prouve que ça compile ; il n'a pas à être signé.
      sign-binaries: false
      asset-prefix: "handy-pr-${{ inputs.pr_number }}"
      upload-artifacts: true
      is-debug-build: ${{ contains(matrix.args, '--debug') }}
      ref: ${{ format('refs/pull/{0}/merge', inputs.pr_number) }}
    # Volontairement pas de `secrets: inherit`.
    #
    # Il transmettait l'intégralité des secrets du dépôt — clé updater,
    # certificats Apple, credentials Azure, jeton de publication — à un job qui
    # exécute le code de la PR. Aucun secret n'est nécessaire pour vérifier
    # qu'une PR compile ; `secrets.GITHUB_TOKEN` reste disponible d'office et
    # est plafonné par les `permissions` ci-dessus.
    #
    # Si un secret devenait un jour indispensable ici, le passer nommément —
    # jamais en rétablissant l'héritage global.

  comment-on-pr:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post artifact links to PR
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              body: `## 🧪 Test Build Ready\n\nBuild artifacts for PR #${{ inputs.pr_number }} are available for testing.\n\n**[Download artifacts from workflow run](${runUrl})**\n\nArtifacts expire after 30 days.`
            });

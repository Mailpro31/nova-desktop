name: "Nova — build Windows (.exe)"

# Build Windows x64 non signé, à la demande. Produit l'installeur NSIS
# (Nova ..._x64-setup.exe) et le MSI en artefacts téléchargeables.
# Non signé : pas de secrets de signature requis (sign-binaries: false), et
# tauri.conf.json a désactivé signCommand + createUpdaterArtifacts.
on:
  workflow_dispatch:
    inputs:
      nova_mode:
        description: "Edition Nova à compiler"
        required: true
        default: "campus"
        type: choice
        options:
          - campus
          - personal
          - lab

jobs:
  windows:
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: "windows-latest"
      target: "x86_64-pc-windows-msvc"
      # Campus s'installe pour toute la machine (déploiement DSI / Intune / GPO) ;
      # Personal garde l'installation par utilisateur de tauri.conf.json.
      build-args: ${{ inputs.nova_mode == 'lab' && '--config src-tauri/tauri.lab.conf.json --features lab' || inputs.nova_mode == 'campus' && '--config src-tauri/tauri.campus.conf.json' || '' }}
      sign-binaries: false
      asset-prefix: ${{ inputs.nova_mode == 'lab' && 'Nova-Lab' || 'Nova' }}
      upload-artifacts: true
      nova_mode: ${{ inputs.nova_mode == 'personal' && 'personal' || 'campus' }}
      nova_lab: ${{ inputs.nova_mode == 'lab' }}
      windows-executable: ${{ inputs.nova_mode == 'lab' && 'Nova Lab.exe' || 'Nova.exe' }}
    secrets: inherit

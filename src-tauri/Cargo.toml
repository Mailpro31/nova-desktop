[package]
name = "handy"
version = "1.0.36"
description = "Nova"
authors = ["Nova"]
edition = "2021"
license = "MIT"
default-run = "handy"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "handy_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# [[bin]]
# name = "cli"
# path = "src/audio_toolkit/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dependencies]
once_cell = "1"
tauri = { version = "2.10.2", features = [
  "protocol-asset",
  "macos-private-api",
  "tray-icon",
  'image-png',
] }
tauri-plugin-log = "2.7.1"
tauri-plugin-opener = "2.5.2"
tauri-plugin-http = "2.5.9"
tauri-plugin-store = "2.4.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-process = "2.3.1"
rusqlite_migration = "2.3"
tauri-plugin-fs = "2.4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = { git = "https://github.com/rustdesk-org/rdev" }
cpal = "0.16.0"
anyhow = "1.0.95"
rubato = "0.16.2"
hound = "3.5.1"
log = "0.4.25"
env_filter = "0.1.0"
tokio = "1.43.0"
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }
enigo = "0.6.1"
rodio = { git = "https://github.com/cjpais/rodio.git" }
reqwest = { version = "0.12", features = ["json", "stream", "blocking", "multipart"] }
keyring = "4.1.6"
futures-util = "0.3"
rustfft = "6.4.0"
strsim = "0.11.0"
natural = "0.5.0"
regex = "1"
chrono = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
tar = "0.4.44"
flate2 = "1.0"
sha2 = "0.10"
# Aléa cryptographique pour PKCE (code_verifier, state, nonce).
getrandom = "0.2"
# Vérification locale des licences Nova (jetons NOVA1 signés Ed25519).
ed25519-dalek = "2"
base64 = "0.22"
# Whisper-family models run through transcribe-cpp (GGUF/ggml, native backends);
# transcribe-rs is now ONNX-only (Parakeet, Moonshine, SenseVoice, GigaAM,
# Canary, Cohere). Per-platform backend features are added in the target tables.
transcribe-rs = { version = "0.3.8", features = ["onnx"] }
transcribe-cpp = { version = "0.1.3", default-features = false }
handy-keys = "0.3.0"
ferrous-opencc = "0.2.3"
clap = { version = "4", features = ["derive"] }
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2.6"
hf-hub = { git = "https://github.com/cjpais/hf-hub", branch = "cancellable-downloads", features = [
  "tokio",
] }
sysinfo = "0.38.4"
# Rapport de plantage optionnel (DORMANT tant que NOVA_SENTRY_DSN est vide).
# rustls pour un transport sans dépendance TLS système (compile partout, y
# compris le vendoring offline nix). Voir src/telemetry.rs.
sentry = { version = "0.34", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "reqwest",
  "rustls",
] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-single-instance = "2.3.2"
tauri-plugin-updater = "2.10.0"

[target.'cfg(windows)'.dependencies]
# ONNX Runtime on Windows is CPU-only (no ort-directml), matching macOS/Linux.
# The DirectML EP was experimental and, more importantly, pulled in pyke's
# prebuilt ONNX Runtime which is compiled with a global /arch:AVX2 baseline that
# executes BMI2/AVX in a static initializer and crashes at process startup on any
# pre-Haswell CPU (Sandy/Ivy Bridge, older AMD). Dropping the feature means we
# link a baseline ONNX Runtime (dynamically, via ORT_LIB_LOCATION in build.yml)
# with proper runtime CPU dispatch. Base `transcribe-rs` (features = ["onnx"])
# is inherited here, so Parakeet/Moonshine/etc. still run on CPU.
windows = { version = "0.61.3", features = [
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  # Nova Commands : GetClipboardSequenceNumber / CountClipboardFormats /
  # IsClipboardFormatAvailable (voir src/nova_commands.rs).
  "Win32_System_DataExchange",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
] }
winreg = "0.55"
# Capture du son des autres participants d'une réunion (voir meeting_capture.rs).
# Enveloppe sûre et testée autour de WASAPI, y compris la capture loopback
# limitée à UN processus (`ActivateAudioInterfaceAsync` +
# `AUDIOCLIENT_PROCESS_LOOPBACK_PARAMS`) : du COM non trivial qu'on ne réécrit
# pas à la main. Le crate s'appuie sur `windows` 0.62, DÉJÀ présent dans l'arbre
# (via sysinfo) — il n'ajoute donc aucune version supplémentaire de `windows`,
# et aucun type Windows ne traverse la frontière entre les deux : la capture
# reste confinée à son module.
wasapi = "0.23"
# Lecture de contexte — palier B (repli OCR). Quand l'accessibilité (palier A)
# ne renvoie rien (apps Electron/canvas), Nova capture la fenêtre active (GDI /
# PrintWindow, via le crate `windows` déjà présent) et lit le texte à l'écran,
# 100 % en local. `ocrs`/`rten` = moteur d'inférence en Rust pur (aucune DLL
# native à distribuer, contrairement à ONNX Runtime).
ocrs = "0.10"
rten = "0.21"
# Palier D (vision cloud) : encodage PNG de la capture avant envoi à turbo-vision.
png = "0.17"
# Lecture de contexte (palier A) : lit le CONTENU texte de la fenêtre active via
# l'API Windows UI Automation (arbre d'accessibilité) — bien plus léger qu'une
# capture d'écran + OCR. Utilisé uniquement quand `context_reading_enabled`.
uiautomation = "0.16"

# Whisper backend per Windows arch. x86_64 ships the Vulkan GPU backend and
# keeps the dynamic-backends posture (loadable per-ISA CPU modules + Vulkan),
# where runtime ISA scoring (GGML_CPU_ALL_VARIANTS) earns the extra shipped DLLs.
#
# Windows-on-ARM is CPU-only: its Adreno Vulkan drivers are immature, and
# ggml-vulkan's shader generator (vulkan-shaders-gen) does not build under the
# clang-cl/lld toolchain that ggml's ARM CPU backend requires. dynamic-backends
# buys nothing on ARM — ALL_VARIANTS is an x86 concept, so a DL build there is
# just a single portable CPU module shipped as a DLL. So ARM links transcribe-cpp
# STATICALLY (no features = static CPU-only): the one CPU backend is compiled into
# handy.exe and we ship zero DLLs, which sidesteps the installer's per-DLL
# signtool verify entirely. CI pins -DGGML_NATIVE=OFF (see build.yml) so the
# static build targets a portable ARM baseline, not the build runner's CPU.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { version = "0.1.3", default-features = false, features = [
  "dynamic-backends",
  "vulkan",
] }

[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "0.1.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
transcribe-cpp = { version = "0.1.3", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
gtk = "0.18"
transcribe-cpp = { version = "0.1.3", default-features = false, features = [
  "dynamic-backends",
  "vulkan",
] }

[patch.crates-io]
tauri-runtime = { git = "https://github.com/cjpais/tauri.git", branch = "handy-2.10.2" }
tauri-runtime-wry = { git = "https://github.com/cjpais/tauri.git", branch = "handy-2.10.2" }
tauri-utils = { git = "https://github.com/cjpais/tauri.git", branch = "handy-2.10.2" }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
